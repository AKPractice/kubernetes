apiVersion: v1
kind: ConfigMap
metadata:
  name: cart
  namespace: roboshop
  labels:
    project: roboshop
    component: cart
    tier: app
data:
  REDIS_HOST: "redis" 
  CATALOGUE_HOST: "catalogue" 
  CATALOGUE_PORT: "8080"
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: roboshop
  labels:
    project: roboshop
    component: cart
    tier: app
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      component: cart
      tier: app
  template:
    metadata:
      labels:
        project: roboshop
        component: cart
        tier: app
    spec:
      containers:
      - name: cart
        image: arunkumarnelluri/cart:v1
        resources:
          requests:
            cpu: "5m"
            memory: "64Mi"
          limits:
            cpu: "10m"
            memory: "128Mi"
        envFrom:
        - configMapRef:
            name: cart
    

---
apiVersion: v1
kind: Service
metadata: 
  name: cart
  namespace: roboshop
  labels:
    project: roboshop
    component: cart
    tier: app
spec:
  selector:
    project: roboshop
    component: cart
    tier: app
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cart
  namespace: roboshop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cart
  minReplicas: 1
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 10

