apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-dynamic
  labels:
    project: roboshop
    purpose: ebs-dynamic-demo
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: roboshop-ebs-sc
  resources:
    requests:
      storage: 4Gi
---

apiVersion: v1
kind: Pod
metadata: 
  name: ebs-dynamic-pod 
  labels:
    project: roboshop
    purpose: ebs-dynamic-demo
spec:
  nodeSelector:
    topology.kubernetes.io/zone: us-east-1a
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: persistent-storage
      mountPath: /usr/share/nginx/html
  volumes:
  - name: persistent-storage
    persistentVolumeClaim:
      claimName: ebs-dynamic
