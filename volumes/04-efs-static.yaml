apiVersion: v1
kind: PersistentVolume
metadata:
  name: efs-static
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-02535b1412640b737
---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: efs-static
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 5Gi
---

apiVersion: v1
kind: Pod
metadata:
  name: efs-static-pod 
  labels:
    project: roboshop
    purpose: efs-static-demo 
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: persistent-volume
      mountPath: /usr/share/nginx/html
  volumes:
  - name: persistent-volume
    persistentVolumeClaim:
      claimName: efs-static
---

apiVersion: v1
kind: Service
metadata:
  name: efs-static
  labels:
    project: roboshop
    purpose: efs-static-demo
spec:
  type: LoadBalancer
  selector:
    project: roboshop
    purpose: efs-static-demo
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80