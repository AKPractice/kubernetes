apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: efs-dynamic
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: efs-dynamic
  resources:
    requests:
      storage: 5Gi
---

apiVersion: v1
kind: Pod
metadata: 
  name: efs-dynamic
  labels:
    project: roboshop
    purpose: efs-dynamic-demo
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: persistent-volume
      MountPath: /usr/share/nginx/html
  volumes:
  - name: persistent-volume 
    persistentVolumeClaim:
      claimName: efs-dynamic
---

apiVersion: v1
kind: Service
metadata:
  name: efs-dynamic
  labels:
    project: roboshop
    purpose: efs-dynamic-demo
spec:
  type: LoadBalancer
  selector:
    project: roboshop
    purpose: efs-dynamic-demo
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80